name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PyInstaller from source (compiles the bootloader on this runner)
        run: pip install --no-binary pyinstaller pyinstaller==6.22.0

      - name: Build, smoke test, checksum, zip (same script as BUILDING.md)
        run: .\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MetroSensUnlock
          path: dist/MetroSensUnlock-*.zip

      - name: Attach zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MetroSensUnlock-*.zip
