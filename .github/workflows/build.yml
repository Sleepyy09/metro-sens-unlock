name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath MetroSensUnlock.html -Pattern 'const VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag does not match source version.' }
      - name: Test and package source-only release
        shell: pwsh
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MetroSensUnlock-Offline
          path: dist/MetroSensUnlock-*-Offline.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MetroSensUnlock-Offline
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/MetroSensUnlock-*-Offline.zip